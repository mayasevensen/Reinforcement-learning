# CNN DQN agent configuration -- small + fast variant.

# --- Network ---
# Hidden dim feeds the dueling heads. 128 is plenty given the CNN
# already does the heavy lifting on the spatial input.
hidden_dim: 128

# --- Learning ---
learning_rate: 0.0003
gamma: 0.99
batch_size: 128

# --- Exploration (training only) ---
# Linear decay from epsilon_start to epsilon_end over `epsilon_decay_steps`
# environment steps stored in the buffer. With ~500 steps/episode and 5000
# episodes that's ~2.5M total steps, so 400k decay reaches epsilon_end at
# roughly episode 800 -- right when the baseline phase starts.
epsilon_start: 1.0
epsilon_end: 0.07
epsilon_decay_steps: 400000

# --- Replay buffer ---
# Pre-allocated. ~400 MB at this capacity with 4x16x16 float32 grids.
# Drop to 20000 if you're tight on RAM.
buffer_size: 50000
min_buffer_size: 5000

# --- Target network: soft (Polyak) update ---
# Applied every train_step. tau=0.005 means the target lags the online
# net by ~200 steps' worth of EMA -- smoother than a hard copy.
tau: 0.005

# --- Training cadence ---
train_every: 4

# --- Inference / eval ---
training: false
weights_dir: "weights"