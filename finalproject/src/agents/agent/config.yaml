# add your agent configuration here
# Example:  
# weights: "path/to/weights.pth"
# epsilon: 0.1
# gamma: 0.99
# learning_rate: 0.001
# buffer_size: 10000
# batch_size: 32
# number_of_mlp_layers: 2
# hidden_units: 128
# action_space: 4

# Agent configuration

# --- Network ---
hidden_dim: 128

# --- Learning ---
learning_rate: 0.0005   # halved vs old config; Huber + dueling tolerates lower LR better
gamma: 0.99
batch_size: 128

# --- Exploration (training only) ---
epsilon_start: 1.0
epsilon_end: 0.07
epsilon_decay: 0.9995   # slightly slower decay -> more exploration over 4000 episodes

# --- Replay buffer ---
buffer_size: 50000
min_buffer_size: 1000   # wait for a healthy buffer before training

# --- Target net & training cadence ---
target_update_freq: 500 # in agent-store steps; with train_every=4 this is ca 125 grad steps
train_every: 4

# --- Inference / eval ---
training: false
# weights_dir: "src/agents/agent/weights"
weights_dir: "weights"